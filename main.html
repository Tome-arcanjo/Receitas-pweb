<!DOCTYPE html>
<html>   
  <head>
    <style>
      table {
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
        width: 100%;
      }
      td, th {
        border: 1px solid #ddd;
        padding: 8px;
      }
      tr:nth-child(even){background-color: #f2f2f2;}
      tr:hover {background-color: #ddd;}
      th {
        padding-top: 12px;
        padding-bottom: 12px;
        text-align: left;
        background-color: #04AA6D;
        color: white;
      }
    </style>
    <meta charset="UTF-8">      
  </head>

  <body>
    <div><button id="botaoCarregar">Carregando cervejas...</button></div>
    <div id="cervejasDiv"></div>            
  </body>   

  <script>
    let cervejas = [
      { name: "Guiness", alcohol: "10%", style: "Red ale", ibu: "20" }, 
      { name: "Desperados", alcohol: "6%", style: "English IPA", ibu: "25" }, 
      { name: "Becks", alcohol: "5%", style: "Lager", ibu: "30" }
    ]

    const carregarTabela = (
      cs,
      elementId = "cervejasDiv",
      headers = null,
      fields = ["name", "alcohol", "style", "ibu"]
    ) => {
      const div = document.getElementById(elementId)

      if (!cs || cs.length === 0) {
        div.innerHTML = "<p>Sem dados disponíveis</p>"
        return
      }

      // se não vier cabeçalho, gera automaticamente a partir de fields
      const cabecalho = `
        <tr>
          ${(headers || fields).map(h => `<th>${h}</th>`).join("")}
        </tr>
      `

      // gera linhas usando as propriedades definidas em fields
      const itensHtml = cs.map(item => `
        <tr>
          ${fields.map(f => `<td>${item[f] ?? ""}</td>`).join("")}
        </tr>
      `)

      div.innerHTML = `<table>${cabecalho}${itensHtml.join("\n")}</table>`
    }

    let botao = document.getElementById("botaoCarregar")
    botao.addEventListener("click", () => carregarTabela(cervejas))
  </script>
</html>
